<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare Web - Control Rider & Taller Autorizado</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container { max-width: 400px; margin: 50px auto; background: #222; padding: 20px; border-radius: 8px; border-top: 4px solid #ff6600; }
        .toggle-btn { background: none; border: none; color: #ff6600; cursor: pointer; text-decoration: underline; margin-top: 15px; display: block; width: 100%; text-align: center;}
    </style>
</head>
<body>
    <header class="header">
        <h1>MotoCare Web</h1>
        <p class="subtitle">Gestión de Mantenimiento Preventivo & Telemetría</p>
    </header>

    <!-- ================= VISTA DE AUTENTICACIÓN ================= -->
    <div id="authView" class="auth-container">
        
        <!-- Formulario Iniciar Sesión -->
        <div id="loginSection">
            <h2> Iniciar Sesión</h2>
            <form id="loginForm">
                <label>Correo Electrónico:</label>
                <input type="email" id="loginCorreo" required placeholder="piloto@correo.com o mecánico">
                
                <label>Contraseña:</label>
                <input type="password" id="loginPassword" required placeholder="Tu contraseña">
                
                <button type="submit">Ingresar</button>
            </form>
            <button class="toggle-btn" onclick="toggleAuth('register')">¿No tienes cuenta? Regístrate aquí</button>
        </div>

        <!-- Formulario Registro -->
        <div id="registerSection" style="display: none;">
            <h2>👤 Registrar Nueva Cuenta</h2>
            <form id="registroForm">
                <label>Nombre del Motociclista:</label>
                <input type="text" id="regNombre" required>

                <label>Correo Electrónico:</label>
                <input type="email" id="regCorreo" required>

                <label>Contraseña:</label>
                <input type="password" id="regPassword" required placeholder="Crea una contraseña">

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;"><label>Placa:</label><input type="text" id="regPlaca" required></div>
                    <div style="flex: 1;"><label>Marca:</label><input type="text" id="regMarca" required></div>
                </div>

                <label>Modelo:</label>
                <input type="text" id="regModelo" required>

                <label>Kilometraje Inicial:</label>
                <input type="number" id="regKmInicial" required min="0">

                <button type="submit">Crear Cuenta e Iniciar</button>
            </form>
            <button class="toggle-btn" onclick="toggleAuth('login')">¿Ya tienes cuenta? Inicia sesión</button>
        </div>
    </div>

    <!-- ================= VISTA PRINCIPAL (SISTEMA) ================= -->
    <div id="appView" class="container" style="display: none;">
        
        <button onclick="cerrarSesion()" style="background: #444; float: right; margin-bottom: 20px;">Cerrar Sesión</button>
        
        <!-- TELEMETRÍA (Visible para ambos, pero bloqueada para Pilotos) -->
        <div class="odometro-panel" id="sectionTelemetria">
            <div style="margin-bottom: 15px; text-align: left;" id="selectorContenedor">
                <label style="color: #ff6600; font-size: 0.9em; margin-top:0;"> Vehículo Activo:</label>
                <select id="selectVehiculosDB" style="background: #111; border: 1px solid #ff6600; color: #fff; font-weight: bold; padding: 10px; width: 100%;">
                    <option value="">Cargando motos...</option>
                </select>
            </div>

            <span class="odometro-label"> Telemetría GPS | Correo: <strong id="lblCorreoDisplay" style="color: #fff;">-</strong></span>
            <div class="odometro-valor" id="odometroDisplay">00000 km</div>
            
            <div class="simador-controles">
                <button type="button" id="btnSimular50" class="btn-simulador"> Avanzar +50 km</button>
                <button type="button" id="btnSimular1000" class="btn-simulador btn-salto">⏩ Avanzar +1,000 km</button>
            </div>
        </div>

        <!-- MÓDULO DE TALLER (Oculto por defecto, visible SOLO para mecánico) -->
        <div class="form-section" id="sectionServicio" style="display: none;">
            <h2>🛠 Módulo de Taller: Registrar Mantenimiento Autorizado</h2>
            <form id="serviceForm">
                <label for="claveMecanico"> Clave de Autorización Taller (PIN):</label>
                <input type="password" id="claveMecanico" required placeholder="PIN interno del taller (Ej: 1234)">

                <label>Tipo de Mantenimiento Realizado:</label>
                <select id="tipoServicio" required>
                    <option value="">Seleccione el trabajo realizado...</option>
                    <option value="Cambio de Aceite">Cambio de Aceite</option>
                    <option value="Tensión y Lubricación de Cadena">Tensión y Lubricación de Cadena</option>
                    <option value="Cambio de Pastillas de Freno">Cambio de Pastillas de Freno</option>
                    <option value="Revisión General">Revisión General</option>
                </select>

                <label>Kilometraje en el que se realizó el trabajo:</label>
                <input type="number" id="kmServicio" required min="0">

                <button type="submit">Validar Clave & Guardar Servicio</button>
            </form>
        </div>

        <!-- BITÁCORA Y ALERTAS -->
        <div class="history-section" id="sectionAlertas">
            <h2>Bitácora & Alertas del Sistema</h2>
            <div id="notificationArea" class="notification" style="display: none;"></div>
            <div id="historyList"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
